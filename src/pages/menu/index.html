<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coffee House — Menu</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/img/logo.svg" />
  <link rel="stylesheet" href="./menu.css" />
  <script type="module" src="../../js/main.js"></script>
</head>

<body>
  <header id="site-header"></header>

  <main>
    <section class="menu container" aria-label="Menu">
      <div class="menu__offer">
        <h1 class="menu__title">Behind each of our cups hides an amazing surprise</h1>

      <!-- Category pills and product cards are rendered by catalog.js from
           src/products.json. Nothing about the catalogue lives in this file:
           the product data has a single source of truth, and duplicating it
           here as markup is what the assignment penalises. -->
      <div class="menu__tabs" role="group" aria-label="Product categories"></div>
      </div>

    <div class="menu__panel">
      <ul class="menu__grid"></ul>

      <div class="menu__more" hidden>
          <button class="menu__refresh" type="button" aria-label="Show more products">
            {{REFRESH_ICON}}
          </button>
        </div>
      </div>
  </main>

  <footer id="site-footer"></footer>
</body>

</html>
