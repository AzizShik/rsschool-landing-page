<!--
  Shared site header (single source of truth).

  This partial is injected into `src/pages/*/index.html` by the `sharedHeader`
  Vite plugin (see vite.config.js), both in dev and in the production build,
  so the header exists in the static HTML without running any JavaScript.

  Placeholders replaced by the plugin per page:
    {{PAGE_HOME}}    – href to the Home page                      (e.g. ./index.html)
    {{PAGE_MENU}}    – href to the Menu page                      (e.g. ../menu/index.html)
    {{ANCHOR_ROOT}}  – prefix for home-section anchors            ('' or '../home/index.html')
    {{MENU_CLASS}}   – extra class for the Menu link              ('' or ' is-active')
    {{MENU_CURRENT}} – extra attribute for the Menu link          ('' or ' aria-current="page"')
    {{CUP_ICON}}     – 20px coffee-cup icon (same shape across links)
    {{CUP_ICON_40}}  – 40px coffee-cup icon (burger menu overlay)
-->
<header id="site-header" class="header">
  <div class="container header__container">
    <div class="header__row">
      <a class="header__logo" href="{{PAGE_HOME}}" aria-label="Coffee House Resource — Home page">
        <img src="../../assets/img/logo.svg" width="100" height="60" alt="" />
      </a>

      <nav class="header__nav" aria-label="Main navigation">
        <ul class="header__nav-list">
          <li class="header__nav-item">
            <a class="nav-link" href="{{ANCHOR_ROOT}}#favorite-coffee"><span>Favorite coffee</span>{{CUP_ICON}}</a>
          </li>
          <li class="header__nav-item">
            <a class="nav-link" href="{{ANCHOR_ROOT}}#about"><span>About</span>{{CUP_ICON}}</a>
          </li>
          <li class="header__nav-item">
            <a class="nav-link" href="{{ANCHOR_ROOT}}#mobile-app"><span>Mobile app</span>{{CUP_ICON}}</a>
          </li>
          <li class="header__nav-item">
            <a class="nav-link" href="{{ANCHOR_ROOT}}#contacts"><span>Contact us</span>{{CUP_ICON}}</a>
          </li>
        </ul>
      </nav>

      <div class="header__actions">
        <div class="theme-switch" role="group" aria-label="Color theme">
          <button class="theme-switch__button theme-switch__button--light" type="button" data-theme-button="light"
            aria-pressed="true" aria-label="Use light theme">
            <svg class="theme-switch__icon theme-switch__icon--sun" viewBox="0 0 22 22" width="22" height="22"
              aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
              <circle cx="11" cy="11" r="3.8" />
              <path
                d="M11 2.2v2M11 17.8v2M2.2 11h2M17.8 11h2M4.6 4.6l1.4 1.4M16 16l1.4 1.4M17.4 4.6 16 6M6 16l-1.4 1.4" />
            </svg>
          </button>
          <button class="theme-switch__button theme-switch__button--dark" type="button" data-theme-button="dark"
            aria-pressed="false" aria-label="Use dark theme">

            <svg class="theme-switch__icon theme-switch__icon--moon" viewBox="0 0 18 18" width="18" height="18"
              aria-hidden="true">
              <path
                d="M9 0C4.03 0 0 4.03 0 9C0 13.97 4.03 18 9 18C13.97 18 18 13.97 18 9C18 8.54 17.96 8.08 17.9 7.64C16.92 9.01 15.32 9.9 13.5 9.9C10.52 9.9 8.1 7.48 8.1 4.5C8.1 2.69 8.99 1.08 10.36 0.0999999C9.92 0.0399999 9.46 0 9 0Z"
                fill="#403F3D" />
            </svg>



          </button>
        </div>

        <a class="nav-link nav-link--menu{{MENU_CLASS}}" href="{{PAGE_MENU}}"
          {{MENU_CURRENT}}><span>Menu</span>{{CUP_ICON}}</a>

        <button class="header__burger" type="button" aria-label="Open menu" aria-expanded="false">
          <svg class="header__burger-icon" viewBox="0 0 18 8" width="18" height="8" aria-hidden="true" fill="none"
            stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
            <path d="M1 1.5h16" />
            <path d="M1 6.5h16" />
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Burger menu overlay — visual state only (interaction is Part 2) -->
  <div class="burger-menu" hidden>
    <ul class="burger-menu__nav">
      <li><a class="burger-menu__link" href="{{ANCHOR_ROOT}}#favorite-coffee">Favorite coffee|Favorite coffee</a></li>
      <li><a class="burger-menu__link" href="{{ANCHOR_ROOT}}#about">About</a></li>
      <li><a class="burger-menu__link" href="{{ANCHOR_ROOT}}#mobile-app">Mobile app</a></li>
      <li><a class="burger-menu__link" href="{{ANCHOR_ROOT}}#contacts">Contact us</a></li>
    </ul>
    <a class="burger-menu__menu-link" href="{{PAGE_MENU}}">{{CUP_ICON_40}}<span>Menu</span></a>
  </div>
</header>
