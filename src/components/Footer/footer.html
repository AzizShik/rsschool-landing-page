<!--
  Shared site footer (single source of truth).

  This partial is injected into every page's `<footer id="site-footer"></footer>`
  by the Vite plugin (see vite.config.js), so the footer exists in the static
  HTML without running any JavaScript.

  Icon placeholders replaced by the plugin:
    {{TWITTER}} {{INSTAGRAM}} {{FACEBOOK}} – 24px social icons
    {{PIN_ICON}} {{PHONE_ICON}} {{CLOCK_ICON}} – 20px contact icons
-->
<footer id="contacts" class="footer">
  <div class="container">
    <div class="footer__card">
      <div class="footer__offer">
        <h2 class="footer__title">Sip, Savor, Smile. It’s coffee time!</h2>
        <ul class="footer__socials" aria-label="Social media">
          <li>
            <a class="footer__social" href="https://twitter.com" target="_blank" rel="noopener noreferrer" aria-label="Twitter">
              {{TWITTER}}
            </a>
          </li>
          <li>
            <a class="footer__social" href="https://www.instagram.com" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
              {{INSTAGRAM}}
            </a>
          </li>
          <li>
            <a class="footer__social" href="https://www.facebook.com" target="_blank" rel="noopener noreferrer" aria-label="Facebook">
              {{FACEBOOK}}
            </a>
          </li>
        </ul>
      </div>

      <div class="footer__info">
        <h3 class="footer__info-title">Contact us</h3>
        <ul class="footer__contacts">
          <li>
            <a
              class="footer__contact"
              href="https://www.google.com/maps?q=8558+Green+Rd.,+Los+Angeles"
              target="_blank"
              rel="noopener noreferrer"
            >
              <span class="footer__contact-icon">{{PIN_ICON}}</span>
              8558 Green Rd., LA
            </a>
          </li>
          <li>
            <a class="footer__contact" href="tel:+16035550123">
              <span class="footer__contact-icon">{{PHONE_ICON}}</span>
              +1 (603) 555-0123
            </a>
          </li>
          <li>
            <span class="footer__contact">
              <span class="footer__contact-icon">{{CLOCK_ICON}}</span>
              Mon–Sat: 9:00–23:00
            </span>
          </li>
        </ul>
      </div>
    </div>
  </div>
</footer>
